<body class="bg-slate-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 老師專屬金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyBduUmDpYh6lv8v-86Tmiay_8xe2dPmehI",
            authDomain: "physics-sync-2026.firebaseapp.com",
            projectId: "physics-sync-2026",
            storageBucket: "physics-sync-2026.firebasestorage.app",
            messagingSenderId: "260212941427",
            appId: "1:260212941427:web:40a7d9eefbd79cf5fcc006"
        };
        
        try {
            const app = initializeApp(firebaseConfig);
            window.firebase = { auth: getAuth(app), db: getFirestore(app), currentAppId: "physics-sync-2026", signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence, doc, setDoc, getDoc, onSnapshot, deleteDoc };
            window.firebaseReady = true; window.dispatchEvent(new Event('firebaseReady'));
        } catch (e) { console.error("Firebase Init Error:", e); }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;
        const APP_VERSION = "v10.3.1 (帳號輸入防呆與提示優化版)";

        const THEME_COLORS = [
            { id: 'sky', name: '晴空水藍', h: 199, s: 89, base: 'bg-sky-400', light: 'bg-sky-50', text: 'text-sky-800' },
            { id: 'teal', name: '沁涼薄荷', h: 174, s: 86, base: 'bg-teal-400', light: 'bg-teal-50', text: 'text-teal-800' },
            { id: 'fuchsia', name: '丁香淺紫', h: 298, s: 70, base: 'bg-fuchsia-400', light: 'bg-fuchsia-50', text: 'text-fuchsia-800' },
            { id: 'violet', name: '夢幻深紫', h: 265, s: 75, base: 'bg-violet-400', light: 'bg-violet-50', text: 'text-violet-800' },
            { id: 'rose', name: '蜜桃粉橘', h: 350, s: 89, base: 'bg-rose-400', light: 'bg-rose-50', text: 'text-rose-800' },
            { id: 'orange', name: '活力暖橘', h: 25, s: 95, base: 'bg-orange-400', light: 'bg-orange-50', text: 'text-orange-800' },
            { id: 'amber', name: '奶油暖黃', h: 45, s: 93, base: 'bg-amber-400', light: 'bg-amber-50', text: 'text-amber-800' }
        ];

        const WEEK_DAYS_DISPLAY = ['日', '一', '二', '三', '四', '五', '六'];
        const PERIODS = [1, 2, 3, 4, 5, 6, 7, 8];
        const DEFAULT_SYLLABUS = { exam1: [{ title: "1-1 物理學的發展", pages: 0 }, { title: "1-2 物理量單位", pages: 0 }], exam2: [{ title: "2-1 速度", pages: 0 }, { title: "2-2 加速度", pages: 0 }], exam3: [{ title: "3-1 牛頓定律", pages: 0 }] };
        
        const initialData = {
            "114": {
                "下學期": {
                    settings: { startDate: "", common: { exam1: [], exam2: [], exam3: [] }, v3: { exam1: [], exam2: [], exam3: [] }, s3: { exam1: [], exam2: [], exam3: [] }, holidays: [] },
                    courses: []
                }
            }
        };

        function App() {
            const [isFirebaseReady, setIsFirebaseReady] = useState(window.firebaseReady || false);
            const [user, setUser] = useState(null);
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            
            const [isCheckingAuth, setIsCheckingAuth] = useState(true); 
            const [requireLogin, setRequireLogin] = useState(false);    
            
            const [syncKey, setSyncKey] = useState(() => localStorage.getItem('physics_sync_key') || null);

            const [loginTab, setLoginTab] = useState('account');
            const [loginAccountId, setLoginAccountId] = useState('');
            const [loginKey, setLoginKey] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isProcessingLogin, setIsProcessingLogin] = useState(false);
            
            // 🌟 核心升級 1：新增「等待確認的新帳號」狀態
            const [pendingNewAccount, setPendingNewAccount] = useState(null);

            const [deleteAccountInput, setDeleteAccountInput] = useState('');
            const [deleteAccountError, setDeleteAccountError] = useState('');
            const [isProcessingDelete, setIsProcessingDelete] = useState(false);

            useEffect(() => {
                if (syncKey) localStorage.setItem('physics_sync_key', syncKey);
            }, [syncKey]);

            const [data, setData] = useState(initialData);
            const [isCopied, setIsCopied] = useState(false);

            const [selectedYear, setSelectedYear] = useState(() => localStorage.getItem('physics_last_year') || "114");
            const [selectedSemester, setSelectedSemester] = useState(() => localStorage.getItem('physics_last_sem') || "下學期");
            const [selectedCourseId, setSelectedCourseId] = useState(() => localStorage.getItem('physics_last_course') || null);
            
            useEffect(() => {
                localStorage.setItem('physics_last_year', selectedYear);
                localStorage.setItem('physics_last_sem', selectedSemester);
                if (selectedCourseId) localStorage.setItem('physics_last_course', selectedCourseId);
            }, [selectedYear, selectedSemester, selectedCourseId]);

            useEffect(() => {
                const currentSemesterCourses = data[selectedYear]?.[selectedSemester]?.courses || [];
                if (currentSemesterCourses.length > 0) {
                    if (!selectedCourseId || !currentSemesterCourses.find(c => c.id === selectedCourseId)) {
                        setSelectedCourseId(currentSemesterCourses[0].id);
                    }
                } else {
                    setSelectedCourseId(null);
                }
            }, [data, selectedYear, selectedSemester, selectedCourseId]);

            useEffect(() => { const h = () => setIsFirebaseReady(true); window.addEventListener('firebaseReady', h); return () => window.removeEventListener('firebaseReady', h); }, []);
            
            useEffect(() => { 
                if (!isFirebaseReady || !window.firebase) return; 

                window.firebase.setPersistence(window.firebase.auth, window.firebase.browserLocalPersistence)
                    .then(() => {
                        return window.firebase.signInAnonymously(window.firebase.auth);
                    })
                    .catch(e => console.error("Auth Error:", e));

                const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        const userKeyRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'users', currentUser.uid, 'data', 'settings');
                        const userKeySnap = await window.firebase.getDoc(userKeyRef);
                        
                        if (userKeySnap.exists() && userKeySnap.data().syncKey) {
                            const cloudKey = userKeySnap.data().syncKey;
                            if (cloudKey !== localStorage.getItem('physics_sync_key')) {
                                setIsCloudLoaded(false); 
                                setSyncKey(cloudKey);    
                                localStorage.setItem('physics_sync_key', cloudKey);
                            }
                            setRequireLogin(false);
                        } else {
                            const currentLocalKey = localStorage.getItem('physics_sync_key');
                            if (currentLocalKey) {
                                await window.firebase.setDoc(userKeyRef, { syncKey: currentLocalKey }, { merge: true });
                                setRequireLogin(false);
                            } else {
                                setRequireLogin(true);
                            }
                        }
                        setIsCheckingAuth(false);
                    }
                }); 
                return () => unsub(); 
            }, [isFirebaseReady]);

            useEffect(() => {
                if (requireLogin || !user || !syncKey || !isFirebaseReady || !window.firebase) return; 
                const docRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'public', 'data', 'shared_progress', syncKey);
                const unsub = window.firebase.onSnapshot(docRef, 
                    (docSnap) => {
                        if (docSnap.exists() && docSnap.data().appData) setData(prev => JSON.stringify(prev) === JSON.stringify(docSnap.data().appData) ? prev : docSnap.data().appData);
                        else window.firebase.setDoc(docRef, { appData: data }, { merge: true }).catch(()=>{});
                        setIsCloudLoaded(true);
                    },
                    (err) => { console.error(err); setIsCloudLoaded(false); }
                );
                return () => unsub();
            }, [requireLogin, user, syncKey, isFirebaseReady]); 
            
            useEffect(() => {
                if (requireLogin || !user || !isCloudLoaded || !syncKey || !window.firebase) return;
                window.firebase.setDoc(window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'public', 'data', 'shared_progress', syncKey), { appData: data }, { merge: true }).catch(e=>console.error(e));
            }, [requireLogin, data, user, isCloudLoaded, syncKey]);

            // 🌟 核心升級 2：拆分登入驗證與建立新帳號邏輯
            const handleExecuteLogin = async () => {
                setLoginError('');
                setIsProcessingLogin(true);

                try {
                    let targetKey = '';

                    if (loginTab === 'account') {
                        if (!/^\d{10}$/.test(loginAccountId)) {
                            setLoginError('格式錯誤：請輸入手機末 6 碼 + 生日 4 碼 (共 10 碼數字)');
                            setIsProcessingLogin(false);
                            return;
                        }

                        const accountRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'public', 'data', 'accounts', loginAccountId);
                        const accSnap = await window.firebase.getDoc(accountRef);

                        if (accSnap.exists() && accSnap.data().syncKey) {
                            // 情況 A：老手登入，直接取回鑰匙
                            targetKey = accSnap.data().syncKey;
                        } else {
                            // 情況 B：新手註冊，🚨 觸發煞車防線！不立刻建立，而是進入確認模式
                            setPendingNewAccount(loginAccountId);
                            setIsProcessingLogin(false);
                            return; // 提早結束，等待使用者二次確認
                        }
                    } else {
                        const upperKey = loginKey.toUpperCase().trim();
                        if (!upperKey.startsWith('PHY-') || upperKey.length < 8) {
                            setLoginError('金鑰格式錯誤：請輸入 PHY- 開頭的正確金鑰');
                            setIsProcessingLogin(false);
                            return;
                        }
                        targetKey = upperKey;
                    }

                    // 綁定舊帳號或金鑰登入的後續處理
                    const userKeyRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'users', user.uid, 'data', 'settings');
                    await window.firebase.setDoc(userKeyRef, { syncKey: targetKey }, { merge: true });

                    localStorage.setItem('physics_sync_key', targetKey);
                    setSyncKey(targetKey);
                    setRequireLogin(false);
                    
                } catch (error) {
                    console.error(error);
                    setLoginError('連線錯誤，請稍後再試。');
                }
                
                setIsProcessingLogin(false);
            };

            // 🌟 核心升級 3：使用者確認後，才真正建立帳號的執行函數
            const handleConfirmCreateAccount = async () => {
                setLoginError('');
                setIsProcessingLogin(true);

                try {
                    // 1. 產生新金鑰
                    const targetKey = 'PHY-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                    
                    // 2. 寫入密碼本
                    const accountRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'public', 'data', 'accounts', pendingNewAccount);
                    await window.firebase.setDoc(accountRef, { syncKey: targetKey }, { merge: true });

                    // 3. 寫入設備晶片
                    const userKeyRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'users', user.uid, 'data', 'settings');
                    await window.firebase.setDoc(userKeyRef, { syncKey: targetKey }, { merge: true });

                    // 4. 更新本地口袋並放行
                    localStorage.setItem('physics_sync_key', targetKey);
                    setSyncKey(targetKey);
                    setPendingNewAccount(null); // 清除懸停狀態
                    setRequireLogin(false);

                } catch (error) {
                    console.error(error);
                    setLoginError('建立帳號時發生錯誤，請稍後再試。');
                }
                
                setIsProcessingLogin(false);
            };

            const handleLogoutAndClear = async () => {
                if (!window.confirm('⚠️ 確定要解除綁定此設備嗎？\n\n這將清除此電腦上的連線紀錄與畫面資料，但您的雲端資料「絕對安全」。\n\n(非常適合在公用講桌電腦使用完畢後點擊)')) return;
                
                if (window.firebase && window.firebase.auth) {
                    await window.firebase.auth.signOut();
                }

                localStorage.removeItem('physics_sync_key');
                localStorage.removeItem('physics_last_year');
                localStorage.removeItem('physics_last_sem');
                localStorage.removeItem('physics_last_course');

                window.location.reload();
            };

            const handleNukeAccount = async () => {
                setDeleteAccountError('');
                setIsProcessingDelete(true);

                try {
                    const accountRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'public', 'data', 'accounts', deleteAccountInput);
                    const accSnap = await window.firebase.getDoc(accountRef);

                    if (!accSnap.exists() || accSnap.data().syncKey !== syncKey) {
                        setDeleteAccountError('驗證失敗：此帳號不存在，或不屬於您當前登入的資料！');
                        setIsProcessingDelete(false);
                        return;
                    }

                    const dataRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'public', 'data', 'shared_progress', syncKey);
                    await window.firebase.deleteDoc(dataRef);
                    
                    await window.firebase.deleteDoc(accountRef);

                    if (user) {
                        const userKeyRef = window.firebase.doc(window.firebase.db, 'artifacts', window.firebase.currentAppId, 'users', user.uid, 'data', 'settings');
                        await window.firebase.deleteDoc(userKeyRef);
                    }

                    localStorage.removeItem('physics_sync_key');
                    localStorage.removeItem('physics_last_year');
                    localStorage.removeItem('physics_last_sem');
                    localStorage.removeItem('physics_last_course');
                    
                    if (window.firebase && window.firebase.auth) {
                        await window.firebase.auth.signOut();
                    }
                    
                    window.location.reload();

                } catch (err) {
                    console.error(err);
                    setDeleteAccountError('刪除過程發生錯誤，請稍後再試。');
                    setIsProcessingDelete(false);
                }
            };

            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalType, setModalType] = useState(''); 
            
            const [activeMainView, setActiveMainView] = useState('calendar');
            const [calendarViewMode, setCalendarViewMode] = useState('day'); 
            
            const [currentDate, setCurrentDate] = useState(new Date()); 
            const [viewDate, setViewDate] = useState(new Date());
            const [editingClassId, setEditingClassId] = useState(null);
            const [editingCell, setEditingCell] = useState(null);
            const [expandedSyllabusTab, setExpandedSyllabusTab] = useState('exam1');
            const [deleteTarget, setDeleteTarget] = useState(null); 
            const [inputSyncKey, setInputSyncKey] = useState('');
            const [activeExamKey, setActiveExamKey] = useState(null);
            const [activeSettingTab, setActiveSettingTab] = useState('common');
            
            const [formData, setFormData] = useState({ system: '技高一', name: '', color: 'sky', className: '', year: '114', semester: '下學期', importSource: 'none', logPage: '', logChapter: '', logFinishedChapters: [], logEvent: null, logEventText: '', holidayDate: '', holidayDesc: '', examData: { startDate: '', common: {}, v3: {}, s3: {} }, syllabusData: { exam1: [], exam2: [], exam3: [] }, courseId: null, classId: null, isConsecutiveLog: true });

            const currentSemesterData = data[selectedYear]?.[selectedSemester] || { settings: { startDate: '', common: {}, v3: {}, s3: {}, holidays: [] }, courses: [] };
            const currentCourses = currentSemesterData.courses || [];
            const currentCourse = currentCourses.find(c => c.id === selectedCourseId) || null;
            const currentTheme = THEME_COLORS.find(t => t.id === (currentCourse?.themeId || 'sky')) || THEME_COLORS[0];
            
            const normalizedHolidays = useMemo(() => {
                const h = currentSemesterData.settings.holidays || [];
                return h.map(item => typeof item === 'string' ? { date: item, desc: '國定假日' } : item);
            }, [currentSemesterData.settings.holidays]);
            
            const getHoliday = (dateKey) => normalizedHolidays.find(h => h.date === dateKey);
            const formatDateKey = (d) => `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
            const isToday = (date) => formatDateKey(date) === formatDateKey(new Date());

            const currentCourseIndex = currentCourses.findIndex(c => c.id === selectedCourseId);
            const hasPrevCourse = currentCourseIndex > 0;
            const hasNextCourse = currentCourseIndex < currentCourses.length - 1;

            const goToPrevCourse = () => { if (hasPrevCourse) setSelectedCourseId(currentCourses[currentCourseIndex - 1].id); };
            const goToNextCourse = () => { if (hasNextCourse) setSelectedCourseId(currentCourses[currentCourseIndex + 1].id); };

            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const onTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX);
            };

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const minSwipeDistance = 50; 
                
                if (distance > minSwipeDistance) {
                    goToNextCourse(); 
                } else if (distance < -minSwipeDistance) {
                    goToPrevCourse(); 
                }
            };

            const getExamName = (dateKey, system, settings) => {
                let track = (system === '技高三' ? 'v3' : (system === '綜高三' ? 's3' : 'common'));
                const trackData = settings[track] || {};
                if ((trackData.exam1 || []).includes(dateKey)) return '第一次段考';
                if ((trackData.exam2 || []).includes(dateKey)) return '第二次段考';
                if ((trackData.exam3 || []).includes(dateKey)) return '第三次段考';
                return null;
            };

            const getGlobalExams = (dateKey, settings) => {
                const tracks = [ { id: 'common', label: '高一二', color: 'bg-amber-100 text-amber-800 border-amber-300' }, { id: 'v3', label: '技三', color: 'bg-orange-100 text-orange-800 border-orange-300' }, { id: 's3', label: '綜三', color: 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300' } ];
                const results = [];
                tracks.forEach(t => {
                    const trackData = settings[t.id]; if (!trackData) return;
                    if ((trackData.exam1 || []).includes(dateKey)) results.push({ ...t, exam: '段1' });
                    else if ((trackData.exam2 || []).includes(dateKey)) results.push({ ...t, exam: '段2' });
                    else if ((trackData.exam3 || []).includes(dateKey)) results.push({ ...t, exam: '段3' });
                });
                return results;
            };

            const allAvailableSemesters = useMemo(() => {
                const list = [];
                Object.keys(data).forEach(y => { Object.keys(data[y]).forEach(s => { list.push({ year: y, semester: s, label: `${y}學年度 ${s}` }); }); });
                list.sort((a, b) => (a.year !== b.year ? parseInt(b.year) - parseInt(a.year) : b.semester.localeCompare(a.semester)));
                return list.slice(0, 6);
            }, [data]);

            const formatDatesForDisplay = (dates) => {
                if (!dates || (Array.isArray(dates) && dates.length === 0)) return '---';
                const dateArr = Array.isArray(dates) ? dates : [dates];
                const parts = dateArr[0].split('-');
                return `${selectedYear}/${parts[1]}/${dateArr.map(d => d.split('-')[2]).join('、')}`;
            };

            const parseDateLocal = (dateStr) => {
                if (!dateStr) return new Date();
                const [y, m, d] = dateStr.split('-');
                return new Date(y, parseInt(m, 10) - 1, parseInt(d, 10));
            };

            const healthData = useMemo(() => {
                if (!currentCourse || !currentSemesterData.settings.startDate) return {};
                
                const realToday = new Date(); 
                realToday.setHours(0,0,0,0);
                
                const startDate = parseDateLocal(currentSemesterData.settings.startDate);
                let snapshotDate = new Date(realToday);
                
                const diffTime = realToday - startDate;
                if (diffTime > 0) { 
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
                    const remainder = diffDays % 7; 
                    snapshotDate.setDate(snapshotDate.getDate() - remainder); 
                } else { 
                    snapshotDate = new Date(startDate); 
                }
                
                snapshotDate.setHours(0,0,0,0);
                const snapshotStr = formatDateKey(snapshotDate);
                const realTodayStr = formatDateKey(realToday);
                const snapshotDisplay = `${snapshotDate.getMonth() + 1}/${snapshotDate.getDate()}`;

                let maxPeriods = 0; const classPeriods = {}; const result = {}; let globalDaysToExam = 999; 

                currentCourse.classes.forEach(cls => {
                    let remainingPeriods = 0; 
                    let totalPeriods = 0;     
                    let taughtPeriods = 0;    
                    let track = (currentCourse.system === '技高三' ? 'v3' : (currentCourse.system === '綜高三' ? 's3' : 'common'));
                    const trackData = currentSemesterData.settings[track] || {};
                    
                    let examLabel = '期末';
                    const e1 = trackData.exam1?.length ? [...trackData.exam1].sort().pop() : null;
                    const e2 = trackData.exam2?.length ? [...trackData.exam2].sort().pop() : null;
                    const e3 = trackData.exam3?.length ? [...trackData.exam3].sort().pop() : null;

                                                <button onClick={() => setIsModalOpen(false)} className="flex-1 py-4 bg-slate-100 text-slate-500 font-black rounded-2xl hover:bg-slate-200 transition-all">取消</button>
                                                <button onClick={handleNukeAccount} disabled={isProcessingDelete || deleteAccountInput.length !== 10} className="flex-1 py-4 bg-rose-500 text-white font-black rounded-2xl shadow-xl shadow-rose-100 hover:bg-rose-600 transition-all disabled:opacity-50 disabled:shadow-none flex justify-center items-center gap-2">
                                                    {isProcessingDelete ? <i className="ph-bold ph-spinner animate-spin text-lg"></i> : <i className="ph-bold ph-trash text-lg"></i>} 確認並引爆
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {modalType === 'devicePairing' && (
                                        <div className="space-y-6">
                                            <div className="p-6 bg-indigo-50 rounded-[32px] text-center">
                                                <p className="text-[10px] font-black text-indigo-400 mb-2">本機同步金鑰</p>
                                                <div className="flex justify-center items-center gap-3">
                                                    <span className="text-3xl font-black text-indigo-700 tracking-widest">{isCopied ? "已複製!" : syncKey}</span>
                                                    {!isCopied && (
                                                        <button onClick={() => { 
                                                            navigator.clipboard.writeText(syncKey).then(()=> {
                                                                setIsCopied(true); setTimeout(()=> setIsCopied(false), 2000);
                                                            }).catch(err => {
                                                                const el = document.createElement('textarea'); el.value = syncKey; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                                                                setIsCopied(true); setTimeout(()=> setIsCopied(false), 2000);
                                                            });
                                                        }} className="p-2 hover:bg-white rounded-xl text-indigo-400 shadow-sm transition-all active:scale-90">
                                                            <i className="ph-bold ph-copy text-xl"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="pt-4 border-t border-slate-100">
                                                <button onClick={handleLogoutAndClear} className="w-full py-4 bg-slate-50 border border-slate-200 text-slate-500 font-black rounded-2xl hover:bg-slate-100 transition-all flex justify-center items-center gap-2">
                                                    <i className="ph-bold ph-plug-x text-lg"></i> 登出並解除綁定 (公用電腦用)
                                                </button>
                                                <p className="text-[10px] text-slate-400 text-center mt-3 font-bold">點擊後將登出並清除這台電腦上的暫存畫面，但<span className="text-emerald-500">雲端資料不會受到任何影響</span>。</p>
                                            </div>
                                        </div>
                                    )}
                                    
                                    {modalType === 'classJournal' && (
                                        <div className="space-y-4">
                                            {editingCell?.block?.length > 1 && (
                                                <div className="flex bg-slate-100 p-1 rounded-2xl mb-2">
                                                    <button onClick={() => setFormData({...formData, isConsecutiveLog: true})} className={`flex-1 py-2 rounded-xl text-xs font-black transition-all ${formData.isConsecutiveLog ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                                        <i className="ph-bold ph-link text-sm mr-1"></i>連堂同進度 ({editingCell.block.length}節)
                                                    </button>
                                                    <button onClick={() => setFormData({...formData, isConsecutiveLog: false})} className={`flex-1 py-2 rounded-xl text-xs font-black transition-all ${!formData.isConsecutiveLog ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                                        單堂獨立 (僅第{editingCell.period}節)
                                                    </button>
                                                </div>
                                            )}

                                            <div className="bg-indigo-50/50 p-2 rounded-[24px] border border-indigo-100/50">
                                                <label className="block text-[10px] font-black text-indigo-400 uppercase tracking-widest pt-1 text-center">目前的教學章節</label>
                                                <select value={formData.logChapter} onChange={(e) => { const newChapter = e.target.value; setFormData({ ...formData, logChapter: newChapter, logPage: newChapter === '本次段考進度全數完成！' ? '-' : '1' }); }} className="w-full bg-transparent py-2 px-4 text-base font-black text-slate-700 outline-none cursor-pointer text-center appearance-none">
                                                    {activeLogGroups.map(exKey => { 
                                                        const chapters = currentCourse?.syllabus?.[exKey] || []; if (chapters.length === 0) return null; 
                                                        const labelStr = exKey === 'exam1' ? '第一次段考' : exKey === 'exam2' ? '第二次段考' : '第三次段考'; 
                                                        return (
                                                            <optgroup key={exKey} label={labelStr} className="font-black text-slate-400 bg-slate-50">
                                                                {chapters.map(ch => { const isFinished = formData.logFinishedChapters.includes(ch.title); return <option key={ch.title} value={ch.title} className="font-bold text-slate-800 bg-white">{ch.title} {isFinished ? '✅ (已完成)' : ''}</option>; })}
                                                            </optgroup>
                                                        ); 
                                                    })}
                                                    {formData.logChapter === '本次段考進度全數完成！' && <option value="本次段考進度全數完成！">🎉 本次段考進度全數完成！</option>}
                                                </select>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="flex flex-col items-center">
                                                    <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">當前進度 (頁數)</label>
                                                    <div className="relative w-full">
                                                        <input type="number" min="1" max={currentChapterMaxPages || undefined} value={formData.logPage} onChange={(e) => { let val = e.target.value; let updatedFinishedChapters = [...formData.logFinishedChapters]; if (currentChapterMaxPages) { if (parseInt(val) > currentChapterMaxPages) val = currentChapterMaxPages.toString(); if (parseInt(val) < currentChapterMaxPages && updatedFinishedChapters.includes(formData.logChapter)) updatedFinishedChapters = updatedFinishedChapters.filter(ch => ch !== formData.logChapter); } else { if (updatedFinishedChapters.includes(formData.logChapter)) updatedFinishedChapters = updatedFinishedChapters.filter(ch => ch !== formData.logChapter); } setFormData({...formData, logPage: val, logFinishedChapters: updatedFinishedChapters}); }} className="w-full text-center px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl font-black text-xl focus:border-indigo-500 outline-none" style={{ paddingRight: currentChapterMaxPages ? '3rem' : '1rem' }} placeholder="12" />
                                                        {currentChapterMaxPages && (<span className="absolute right-4 top-1/2 -translate-y-1/2 text-[12px] font-black text-slate-300 pointer-events-none select-none">/ {currentChapterMaxPages}</span>)}
                                                    </div>
                                                </div>
                                                <div className="flex flex-col justify-end">
                                                    <button onClick={(e) => { e.preventDefault(); handleNextProgress(); }} className="w-full h-[52px] rounded-2xl font-black text-sm flex items-center justify-center gap-2 transition-all bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white border border-emerald-100 group"><i className="ph-bold ph-check-circle text-xl group-hover:scale-110 transition-transform"></i> 本章節完成</button>
                                                </div>
                                            </div>

                                            <div className="flex gap-2 justify-center mt-4 border-t pt-4">
                                                {[{id:'quiz',l:'小考',i:'ph-pencil-simple'},{id:'lab',l:'實驗',i:'ph-flask'},{id:'study',l:'自修',i:'ph-book-open'},{id:'other',l:'其他',i:'ph-balloon'}].map(evt=><button key={evt.id} onClick={()=>setFormData({...formData, logEvent:formData.logEvent===evt.id?null:evt.id})} className={`flex-1 py-2 rounded-xl text-xs font-black border-2 ${formData.logEvent===evt.id?'bg-indigo-50 border-indigo-400 text-indigo-600':'bg-slate-50 border-slate-100 text-slate-500'}`}><i className={`ph-bold ${evt.i} mr-1`}></i>{evt.l}</button>)}
                                            </div>
                                            {formData.logEvent && (<input type="text" value={formData.logEventText} onChange={(e) => setFormData({...formData, logEventText: e.target.value})} placeholder={formData.logEvent === 'quiz' ? '輸入考試範圍' : formData.logEvent === 'lab' ? '輸入實驗名稱' : '活動說明'} className="w-full px-4 py-3 bg-white border-2 border-indigo-100 rounded-xl text-sm font-bold text-slate-700 outline-none mt-2 shadow-sm" />)}
                                            
                                            {(() => {
                                                const clsForLog = currentCourse?.classes.find(cl => cl.id === editingCell?.classId);
                                                const hasExistingLog = clsForLog?.logs.some(l => l.date === editingCell?.date && l.period === editingCell?.period);
                                                return (
                                                    <div className="flex gap-3 mt-4">
                                                        {hasExistingLog && (
                                                            <button onClick={() => {
                                                                const newData = { ...data };
                                                                const semester = newData[selectedYear][selectedSemester];
                                                                const cls = semester.courses.find(c => c.classes.some(cl => cl.id === editingCell.classId)).classes.find(cl => cl.id === editingCell.classId);
                                                                
                                                                const periodsToDelete = (formData.isConsecutiveLog && editingCell.block?.length > 1) ? editingCell.block : [editingCell.period];
                                                                
                                                                cls.logs = cls.logs.filter(l => !(l.date === editingCell.date && periodsToDelete.includes(l.period)));
                                                                
                                                                setData(newData);
                                                                setIsModalOpen(false);
                                                            }} className="w-1/3 py-4 bg-rose-50 border-2 border-rose-100 text-rose-500 font-black rounded-2xl hover:bg-rose-500 hover:text-white transition-all flex items-center justify-center gap-1">
                                                                <i className="ph-bold ph-trash text-lg"></i> <span className="hidden sm:inline">刪除</span>
                                                            </button>
                                                        )}
                                                        <button onClick={handleSave} className="flex-1 py-4 bg-slate-900 text-white font-black rounded-2xl shadow-xl">儲存進度紀錄</button>
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    )}
                                    
                                    {modalType === 'editSchedule' && (
                                        <div className="space-y-4 overflow-x-auto">
                                            <div className="grid grid-cols-6 gap-1 min-w-[300px]">
                                                <div/>
                                                {['一','二','三','四','五'].map(d=><div key={d} className="text-center text-[10px] font-black text-slate-400">週{d}</div>)}
                                                {PERIODS.map(p=>(
                                                    <Fragment key={p}>
                                                        <div className="flex items-center justify-center text-[10px] font-bold text-slate-400">第{p}節</div>
                                                        {[1,2,3,4,5].map(dIdx=>{ 
                                                            const isSel = currentCourse?.classes.find(c=>c.id===editingClassId)?.schedule.some(s=>s.day===dIdx&&s.period===p); 
                                                            const conflictName = getConflictingClassName(dIdx, p); 
                                                            const hasConflict = isSel && conflictName; 
                                                            return <button key={`${dIdx}-${p}`} onClick={()=>toggleSchedule(dIdx, p)} className={`h-10 rounded-lg border-2 transition-all relative flex flex-col items-center justify-center ${isSel?'bg-indigo-600 border-indigo-600 text-white':hasConflict?'border-rose-400 ring-2 ring-rose-200 bg-rose-50':'bg-slate-50 border-slate-100 hover:bg-slate-100'}`}>{isSel?<i className="ph-bold ph-plus"></i>:conflictName?<span className="text-[8px] font-black opacity-60 text-rose-500 scale-90 truncate w-full px-1">{conflictName}</span>:null}</button> 
                                                        })}
                                                    </Fragment>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {modalType === 'semesterSettings' && (
                                        <div className="space-y-6">
                                            <div className="bg-slate-50 p-4 rounded-2xl flex justify-between items-center"><span className="text-sm font-black text-slate-700">學期開學日</span><input type="date" value={formData.examData.startDate||''} onChange={(e)=>setFormData({...formData, examData:{...formData.examData, startDate:e.target.value}})} className="p-2 rounded-xl outline-none" /></div>
                                            <div className="flex p-1 bg-slate-100 rounded-2xl">{[{id:'common',l:'通用'},{id:'v3',l:'技三'},{id:'s3',l:'綜三'}].map(t=><button key={t.id} onClick={()=>setActiveSettingTab(t.id)} className={`flex-1 py-2 text-xs font-black rounded-xl ${activeSettingTab===t.id?'bg-white text-indigo-600 shadow-sm':'text-slate-400'}`}>{t.l}</button>)}</div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8">
                                                <div className="space-y-2">
                                                    {['exam1','exam2','exam3'].map(k=>{ 
                                                        const dates = formData.examData[activeSettingTab][k] || [];
                                                        return (
                                                            <button key={k} onClick={()=>setActiveExamKey(k)} className={`relative w-full flex items-center justify-between p-4 rounded-2xl border-2 transition-all ${activeExamKey===k?'border-indigo-400 bg-indigo-50 shadow-sm':'border-slate-50 bg-slate-50'}`}>
                                                                <span className="text-xs font-black text-slate-600">{k==='exam1'?'段考一':k==='exam2'?'段考二':'段考三'}</span>
                                                                {dates.length > 0 && <span className="absolute left-1/2 -translate-x-1/2 text-[10px] font-bold text-slate-400 tracking-wider">{formatDatesForDisplay(dates)}</span>}
                                                                <span className="text-[10px] font-bold text-indigo-500 bg-white px-2 py-1 rounded-full shadow-sm">{dates.length} 天</span>
                                                            </button>
                                                        )
                                                    })}
                                                </div>
                                                <div className="bg-slate-50 rounded-3xl p-5 border border-slate-100">
                                                    {activeExamKey ? (
                                                        <div className="space-y-4">
                                                            <div className="flex justify-between px-2">
                                                                <button onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1))} className="p-1 hover:bg-white rounded-lg"><i className="ph-bold ph-caret-left"></i></button>
                                                                <span className="text-xs font-black text-slate-600">{viewDate.getFullYear()}年 {viewDate.getMonth()+1}月</span>
                                                                <button onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1))} className="p-1 hover:bg-white rounded-lg"><i className="ph-bold ph-caret-right"></i></button>
                                                            </div>
                                                            <div className="grid grid-cols-7 gap-1">
                                                                {WEEK_DAYS_DISPLAY.map((d, index) => <div key={d} className={`text-center text-[9px] font-black py-1 ${index === 0 ? 'text-red-500' : index === 6 ? 'text-blue-500' : 'text-slate-400'}`}>{d}</div>)}
                                                                {(() => { 
                                                                    const { firstDay, days } = getDaysInMonth(viewDate); const grid = []; 
                                                                    for(let i=0; i<firstDay; i++) grid.push(<div key={`e-${i}`} />); 
                                                                    for(let d=1; d<=days; d++) { 
                                                                        const ds = `${viewDate.getFullYear()}-${(viewDate.getMonth()+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`; 
                                                                        const sel = (formData.examData[activeSettingTab][activeExamKey] || []).includes(ds); 
                                                                        
                                                                        const currentDayIndex = new Date(viewDate.getFullYear(), viewDate.getMonth(), d).getDay();
                                                                        const defaultColor = currentDayIndex === 0 ? 'text-red-500 bg-red-50/50' : currentDayIndex === 6 ? 'text-blue-500 bg-blue-50/50' : 'text-slate-600 hover:bg-white';

                                                                        grid.push(<button key={d} onClick={() => toggleDateInExam(ds)} className={`aspect-square text-[10px] font-bold rounded-lg transition-all ${sel ? 'bg-indigo-600 text-white shadow-md scale-110' : defaultColor}`}>{d}</button>); 
                                                                    } return grid; 
                                                                })()}
                                                            </div>
                                                        </div>
                                                    ) : <div className="h-full flex flex-col items-center justify-center text-slate-300 py-10"><i className="ph-bold ph-calendar text-3xl mb-2 opacity-20"></i><p className="text-[10px] font-bold">請選取段考項目</p></div>}
                                                </div>
                                            </div>
                                            <button onClick={handleSave} className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl mt-4">儲存設定</button>
                                        </div>
                                    )}

                                    {modalType === 'editSyllabus' && (
                                        <div className="space-y-4">
                                            {['exam1','exam2','exam3'].map(k=>(
                                                <div key={k} className="border-2 border-slate-100 rounded-2xl overflow-hidden">
                                                    <button onClick={()=>setExpandedSyllabusTab(expandedSyllabusTab===k?null:k)} className="w-full p-4 bg-slate-50 font-black text-left flex justify-between items-center">{k==='exam1'?'第一次段考範圍':k==='exam2'?'第二次段考範圍':'第三次段考範圍'} <i className={`ph-bold ph-caret-down transition-transform ${expandedSyllabusTab===k?'rotate-180':''}`}></i></button>
                                                    {expandedSyllabusTab===k && (
                                                        <div className="p-4 space-y-3">
                                                            {(formData.syllabusData[k]||[]).map((ch,idx)=>(
                                                                <div key={idx} className="flex gap-2 items-center bg-white border border-slate-100 p-2 rounded-xl">
                                                                    <div className="flex flex-col gap-1">
                                                                        <button onClick={() => moveSyllabus(k, idx, -1)} disabled={idx===0} className="text-slate-300 hover:text-indigo-600 disabled:opacity-30"><i className="ph-bold ph-arrow-up text-[10px]"></i></button>
                                                                        <button onClick={() => moveSyllabus(k, idx, 1)} disabled={idx===(formData.syllabusData[k].length-1)} className="text-slate-300 hover:text-indigo-600 disabled:opacity-30"><i className="ph-bold ph-arrow-down text-[10px]"></i></button>
                                                                    </div>
                                                                    <input type="text" value={ch.title} onChange={(e)=>{const n={...formData.syllabusData};n[k][idx].title=e.target.value;setFormData({...formData,syllabusData:n})}} className="flex-1 p-2 bg-slate-50 rounded outline-none font-bold text-sm"/>
                                                                    <div className="flex items-center gap-1 bg-slate-50 px-2 rounded text-sm">
                                                                        <input type="number" value={ch.pages||''} onChange={(e)=>{const n={...formData.syllabusData};n[k][idx].pages=parseInt(e.target.value)||0;setFormData({...formData,syllabusData:n})}} className="w-14 py-2 px-1 bg-transparent outline-none text-center font-black" placeholder="-"/>
                                                                        <span className="text-xs text-slate-400">頁</span>
                                                                    </div>
                                                                    <button onClick={()=>{const n={...formData.syllabusData};n[k].splice(idx,1);setFormData({...formData,syllabusData:n})}} className="p-2 text-rose-300 hover:text-rose-500 bg-rose-50 rounded-lg"><i className="ph-bold ph-trash"></i></button>
                                                                </div>
                                                            ))}
                                                            <button onClick={()=>{const n={...formData.syllabusData};n[k].push({title:'新章節',pages:0});setFormData({...formData,syllabusData:n})}} className="w-full p-3 border-2 border-dashed rounded-xl text-slate-400 font-bold hover:border-indigo-300 hover:text-indigo-500"><i className="ph-bold ph-plus"></i> 新增章節</button>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                            <button onClick={handleSave} className="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl mt-4">儲存課綱</button>
                                        </div>
                                    )}

                                    {modalType === 'backupRestore' && (<div className="space-y-6"><div className="bg-sky-50 p-6 rounded-[32px] text-center"><i className="ph-bold ph-download-simple text-4xl text-sky-500 mb-2"></i><h4 className="font-black">下載備份檔</h4><p className="text-xs text-slate-500 mb-4">將所有設定下載為 JSON</p><button onClick={handleExport} className="bg-sky-500 text-white px-6 py-3 rounded-xl font-bold">匯出</button></div><div className="bg-rose-50 p-6 rounded-[32px] text-center relative"><i className="ph-bold ph-upload-simple text-4xl text-rose-500 mb-2"></i><h4 className="font-black">還原備份檔</h4><p className="text-xs text-rose-400 mb-4">⚠️ 將覆蓋目前所有資料</p><label className="bg-rose-500 text-white px-6 py-3 rounded-xl font-bold cursor-pointer">匯入<input type="file" accept=".json" className="hidden" onChange={handleImport} /></label></div></div>)}
                                    
                                    {modalType === 'editHoliday' && (
                                        <div className="space-y-4 text-center">
                                            <i className="ph-fill ph-tree-palm text-4xl text-rose-400"></i>
                                            <h4 className="font-black text-lg">{formData.holidayDate} 停課設定</h4>
                                            <input type="text" value={formData.holidayDesc} onChange={(e)=>setFormData({...formData, holidayDesc:e.target.value})} className="w-full p-4 border-2 border-rose-100 rounded-2xl outline-none text-center bg-rose-50 text-rose-700 font-bold" placeholder="例如: 校慶補假"/>
                                            <div className="flex gap-3">
                                                <button onClick={()=>{const n={...data};n[selectedYear][selectedSemester].settings.holidays=(n[selectedYear][selectedSemester].settings.holidays||[]).filter(h=>(typeof h==='string'?h:h.date)!==formData.holidayDate);setData(n);setIsModalOpen(false);}} className="flex-1 py-4 bg-slate-100 text-rose-400 font-black rounded-2xl hover:bg-rose-50 flex justify-center items-center gap-2"><i className="ph-bold ph-trash"></i> 刪除此停課日</button>
                                                <button onClick={handleSave} className="flex-1 py-4 bg-rose-500 text-white font-black rounded-2xl">儲存設定</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
